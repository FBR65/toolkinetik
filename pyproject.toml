[project]
name = "toolkinetik"
version = "0.1.0"
description = "ToolKinetik — selbsterweiterndes Agentenframework"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ToolKinetik Team" }]

dependencies = [
    "agno>=2.8.6,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "nicegui>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "websockets>=13,<14",
    "docker>=7.0,<8.0",
    "typer>=0.12,<1.0",
    "rich>=13,<14",
    "openai>=1.40,<2.0",
    "pydantic-settings>=2.4,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0",
    "hypothesis>=6.100",
]
rag = [
    "lancedb",
    "sentence-transformers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolkinetik"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring real infrastructure (Docker, uvx, LLM, LanceDB)",
    "docker: tests requiring a real Docker daemon",
    "wigolo: tests requiring the wigolo MCP server via uvx",
    "llm: tests requiring a real LLM endpoint (set TOOLKINETIK_TEST_LLM_BASE)",
    "ui: tests requiring a browser (Playwright/Selenium)",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["skills/"]  # vendored skill scripts — not our code, separate lint standards

[tool.ruff.lint]
ignore = [
    "BLE001",   # blind except — legitimate for defensive error boundaries
    "PLW1510",  # subprocess.run without check — intentional, we handle returncode
    "RUF012",   # mutable class var — frozen-like sets, not mutated at runtime
    "S110",     # try-except-pass — intentional silent cleanup
    "PYI063",   # PEP 570 syntax — pydantic override signature
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "playwright>=1.62.0",
]

services:
  core:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./skills:/app/skills
      - ./data:/app/data
    env_file:
      - .env
    command: uv run uvicorn agno_agent_os.main:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./skills:/app/skills
      - ./data:/app/data
    env_file:
      - .env
    command: uv run python -m agno_agent_os.ui
    depends_on:
      - core

  sandbox:
    image: python:3.12-slim
    volumes:
      - ./skills:/skills:ro
    command: ["sleep", "infinity"]
    network_mode: bridge
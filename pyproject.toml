[project]
name = "toolkinetik"
version = "0.1.0"
description = "ToolKinetik — selbsterweiterndes Agentenframework"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ToolKinetik Team" }]

dependencies = [
    "agno",
    "fastapi",
    "uvicorn",
    "nicegui",
    "httpx",
    "websockets",
    "docker",
    "typer",
    "rich",
    "openai",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolkinetik"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
ignore = [
    "BLE001",   # blind except — legitimate for defensive error boundaries
    "PLW1510",  # subprocess.run without check — intentional, we handle returncode
    "RUF012",   # mutable class var — frozen-like sets, not mutated at runtime
    "S110",     # try-except-pass — intentional silent cleanup
    "PYI063",   # PEP 570 syntax — pydantic override signature
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true